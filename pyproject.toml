[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impulso"]

[tool.hatch.build]
include = ["src/impulso"]

[project]
name = "impulso_mna"
version = "2.2.2"
authors = [
  { name="kvdijken", email="sla_nippers_0x@icloud.com" },
]
dependencies = [
"numpy"
]

description = "A package for the simulation of analog electronic circuits using Modified Nodal Analysis"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
examples=[
"matplotlib",
"quantiphy",
"labellines"
]
test=[
  "pytest"
]

[project.urls]
Homepage = "https://github.com/kvdijken/impulso-mna"
